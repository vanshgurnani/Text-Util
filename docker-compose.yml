services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: noteform
      APP_ENV: ${APP_ENV:-development}
      WEB_SESSION_DAYS: ${WEB_SESSION_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
      MCP_RATE_LIMIT: ${MCP_RATE_LIMIT:-120}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORS_ORIGINS: http://localhost:3000
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-https://mcp.example.com/mcp}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_USER_ID: ${MCP_USER_ID:-}
      MCP_TOKEN_SCOPES: ${MCP_TOKEN_SCOPES:-notes:read notes:write}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: noteform
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
